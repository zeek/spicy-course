# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files

- repo: https://github.com/pre-commit/mirrors-prettier
  rev: f12edd9c7be1c20cfa42420fd0e6df71e42b51ea  # frozen: v4.0.0-alpha.8
  hooks:
  - id: prettier
    types: [json]

- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: a4d5d37e66ebcd6b3705204a1d6dbb56dea66338  # frozen: v0.49.0
  hooks:
  # - id: markdownlint
  - id: markdownlint-fix

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']

- repo: https://github.com/crate-ci/typos
  rev: 37bb98842b0d8c4ffebdb75301a13db0267cef89  # frozen: typos-dict-v0.13.30
  hooks:
  - id: typos

- repo: https://github.com/streetsidesoftware/cspell-cli
  rev: ea11f9efc0bec520073405bc30552da887ba71bc  # frozen: v10.0.1
  hooks:
  - id: cspell
    types: [markdown]

- repo: https://github.com/rhysd/actionlint
  rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
  hooks:
  - id: actionlint

- repo: https://github.com/pre-commit/mirrors-eslint
  rev: 97a8e4af05a8fa8a0ed79d2fbd1f4c86bf1a0178  # frozen: v10.5.0
  hooks:
  - id: eslint

exclude: src/(css|js)/(mermaid|mdbook).*
